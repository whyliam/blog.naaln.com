# Site-specific Aether configuration. Theme defaults are generic.
# Theme revision and this file are deployed together.
menu:
  首页: / || fa fa-home
  写作: /archives/ || fa fa-pencil-alt
  系列: /series/ || fa fa-layer-group
  影像: /visuals/ || fa fa-camera-retro
  关于: /about/ || fa fa-user
social:
  GitHub: https://github.com/whyliam || fab fa-github
  微博: https://weibo.com/whyliam || fab fa-weibo
  X: https://twitter.com/whyliam || fab fa-x-twitter
  RSS: /atom.xml || fa fa-rss
social_icons:
  enable: true
  icons_only: true
  transition: false
footer:
  since: 2010
  icon:
    name: fa fa-feather
    animated: false
    color: '#2a3a6b'
  copyright: 行权 · Liam
  powered: false
aether:
  reading_progress: true
  hero:
    name: Liam · 行权
    intro: 记录 AI 系统、产品判断与知识管理，在写作中留下可回看的思考。
    eyebrow: 个人知识档案 · 始于 2010
    links:
      - label: 探索我的思考
        url: /archives/
      - label: 关于我
        url: /about/
  latest:
    limit: 3
    title: 最近更新
  notes_visuals:
    title: 短札与影像
    enable: true
  notes:
    enable: true
    more_url: /categories/Notes-Reflections/
    limit: 3
  visuals:
    enable: true
    more_url: /visuals/
    posts:
      - /2014/09/second-speed-time-lapse-photography-short-barcelona-barcelona-go/
      - /2013/08/become-a-tired-dreams-one-night-in-paris/
      - /2014/01/where-is-the-most-beautiful-scenery-the-train-lines/
      - /2013/11/how-to-use-the-slr-film-night/
