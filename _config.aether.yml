      - label: RSS · 订阅档案更新
        url: /atom.xml
        hint: Reader
      - label: Newsletter · 周刊归档
        url: /newsletter/
        hint: Archive
      - label: GitHub · 开源项目
        url: https://github.com/whyliam
        hint: 项目
      - label: 微博 · WhyLiam
        url: https://weibo.com/whyliam
        hint: 动态
