  paths:
    title: 精选阅读
    items:
      - intent: 理解 AI 系统与 Agent
        description: AI 如何改变编码方式，Agent 生态的演进
        posts:
          - slug: 2026/05/agent-new-species-economic-system
          - slug: 2026/03/OpenClaw-90-Day-Hit
      - intent: 理解产品、数据与判断
        description: 数据产品思维，从 PM 视角看技术演进
        posts:
          - slug: 2024/01/notion
      - intent: 理解长期写作与知识系统
        description: 个人知识管理，Obsidian 实践，写作作为思考
        posts:
          - slug: 2026/01/knowledge-key
          - slug: 2025/03/PDAA-circle
    enable: true
  series:
    enable: true
    title: 长期系列
    featured: Newsletter 周刊
    featured_description: 持续观察 AI、产品与技术世界的变化。
    rules:
      - name: Newsletter 周刊
        title_pattern: ^L\d+[_:：]
        path_pattern: newsletter[-_]?\d+
        issue_pattern: ^L(\d+)[_:：]\s*
      - name: AI Coding Harness
        tags:
          - AI Coding
        title_pattern: AI Coding|Vibe Coding|Claude Code|Cursor|Copilot|Codex|Aider|Cline
      - name: Agent Runtime
        tags:
          - Agent
          - AgenticAI
        title_pattern: \bAgent\b|智能体|OpenClaw|MCP|Manus
      - name: Obsidian Knowledge System
        tags:
          - Obsidian
        title_pattern: Obsidian|知识管理|笔记系统|\bPKM\b|Second Brain
      - name: 2016 设计年鉴
        title_pattern: 2016.*设计年鉴
        path_pattern: design-yearbook-of-2016
  newsletter:
    text: 关注更新
    channels:
      - label: RSS
        url: /atom.xml
      - label: Newsletter
        url: /newsletter/
      - label: GitHub
        url: https://github.com/whyliam
        external: true
      - label: X
        url: https://twitter.com/whyliam
        external: true
    enable: true
    series: Newsletter 周刊
    title: 让思考，慢慢抵达。
    description: 关于 AI、产品与技术世界的观察。用你习惯的方式，接着读下去。
    rss_url: /atom.xml
    rss_label: 通过 RSS 关注更新
    status: 邮件订阅尚未开放。现在可以在阅读器里订阅本站。
    recent_title: 最近三期
  cta:
