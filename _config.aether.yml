      article_width: 720
      gutter: 50
      mobile_gutter: 20
    glass:
      enable: true
      pointer: true
      blur: 16
      saturation: 160
      follow_duration: 100
      opacity:
        light: 0.56
        dark: 0.66
      reflection:
        light: 0.82
        dark: 0.24
      rim:
        light: 0.95
        dark: 0.36
