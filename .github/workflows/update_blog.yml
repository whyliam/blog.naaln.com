# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Update Blog

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: read

concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install dependencies
        run: npm ci
      # Theme and plugins are locked npm releases; only articles remain a submodule.
      - run: git submodule update --init --recursive
      # Scheduled builds may still pick up newly published articles.
      - run: git submodule update --remote source/_posts
      - run: npm run test:build-plugins
      - run: npx hexo clean

      # 先运行 hexo generate 生成 db.json
      - run: npx hexo generate

      - run: npm run test:site-output

      - name: Verify build output
        run: |
          if [ ! -s public/index.html ]; then
            echo "ERROR: index.html is empty or missing"
            exit 1
          fi
          echo "Build verification passed: $(wc -c < public/index.html) bytes"

      # 然后运行 hexo algolia
      - run: npx hexo algolia
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}

      # 最后部署
      - run: npx hexo deploy
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BING_TOKEN: ${{ secrets.BING_TOKEN }}
          UPYUN_OPERATOR: ${{ secrets.UPYUN_OPERATOR }}
          UPYUN_PASSWORD: ${{ secrets.UPYUN_PASSWORD }}
